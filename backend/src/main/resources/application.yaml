spring:
  application:
    name: chat
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    redis:
      repositories:
        enabled: false

  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  access-token-secret: ${JWT_ACCESS_TOKEN_SECRET}
  refresh-token-secret: ${JWT_REFRESH_TOKEN_SECRET}
  refresh-token-hash-secret: ${JWT_REFRESH_TOKEN_HASH_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  outbox:
    worker:
      enabled: true
      fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS:500}
      initial-delay-ms: ${OUTBOX_WORKER_INITIAL_DELAY_MS:1000}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
      max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:10}
      initial-retry-delay: ${OUTBOX_WORKER_INITIAL_RETRY_DELAY:5s}
      max-retry-delay: ${OUTBOX_WORKER_MAX_RETRY_DELAY:15m}
      processing-timeout: ${OUTBOX_WORKER_PROCESSING_TIMEOUT:60s}
      scheduler-pool-size: ${OUTBOX_WORKER_SCHEDULER_POOL_SIZE:1}

  market:
    sync:
      enabled: ${MARKET_SYNC_ENABLED:true}
      initial-delay-ms: ${MARKET_SYNC_INITIAL_DELAY_MS:10000}
      markets-delay-ms: ${MARKET_SYNC_MARKETS_DELAY_MS:1800000}
      trending-delay-ms: ${MARKET_SYNC_TRENDING_DELAY_MS:3600000}
      scheduler-pool-size: ${MARKET_SYNC_SCHEDULER_POOL_SIZE:1}

    stream:
      enabled: ${MARKET_STREAM_ENABLED:true}
      base-url: ${MARKET_STREAM_BASE_URL:wss://stream.binance.com:9443/ws}
      initial-delay-ms: ${MARKET_STREAM_INITIAL_DELAY_MS:15000}
      reconnect-delay-ms: ${MARKET_STREAM_RECONNECT_DELAY_MS:60000}
      max-pairs: ${MARKET_STREAM_MAX_PAIRS:200}
      candle-intervals: ${MARKET_STREAM_CANDLE_INTERVALS:4h,1d,1w}
      ticker-cache-ttl: ${MARKET_STREAM_TICKER_CACHE_TTL:10m}
      ticker-symbols-cache-ttl: ${MARKET_STREAM_TICKER_SYMBOLS_CACHE_TTL:5m}
      candle-cache-ttl: ${MARKET_STREAM_CANDLE_CACHE_TTL:8d}

  storage:
    r2:
      enabled: ${R2_ENABLED:false}
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      presigned-upload-ttl: ${R2_PRESIGNED_UPLOAD_TTL:10m}
      max-file-size-bytes: ${R2_MAX_FILE_SIZE_BYTES:26214400}
      allowed-content-types: ${R2_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,audio/mpeg,audio/ogg,application/pdf,text/plain,application/zip}

springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
