spring:
  application:
    name: traderhub
  profiles:
    default: ${SPRING_PROFILES_ACTIVE}

  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: redis

  ai:
    model:
      chat: openai
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:dummy}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY}

jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  access-token-secret: ${JWT_ACCESS_TOKEN_SECRET}
  refresh-token-secret: ${JWT_REFRESH_TOKEN_SECRET}
  refresh-token-hash-secret: ${JWT_REFRESH_TOKEN_HASH_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  auth:
    user-details-cache-ttl: ${AUTH_USER_DETAILS_CACHE_TTL:2m}
    user-lookup-cache-ttl: ${AUTH_USER_LOOKUP_CACHE_TTL:10m}
    email-verification:
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL}
      frontend-url: ${EMAIL_VERIFICATION_FRONTEND_URL}
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL}
      frontend-url: ${PASSWORD_RESET_FRONTEND_URL}

  mail:
    sendgrid:
      api-key: ${SENDGRID_API_KEY}
      from-email: ${SENDGRID_FROM_EMAIL}
      from-name: ${SENDGRID_FROM_NAME}
      password-reset-subject: ${SENDGRID_PASSWORD_RESET_SUBJECT}
      email-verification-subject: ${SENDGRID_EMAIL_VERIFICATION_SUBJECT}
      login-alert-subject: ${SENDGRID_LOGIN_ALERT_SUBJECT}
      password-changed-subject: ${SENDGRID_PASSWORD_CHANGED_SUBJECT}

  outbox:
    worker:
      fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS}
      initial-delay-ms: ${OUTBOX_WORKER_INITIAL_DELAY_MS}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE}
      max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS}
      initial-retry-delay: ${OUTBOX_WORKER_INITIAL_RETRY_DELAY}
      max-retry-delay: ${OUTBOX_WORKER_MAX_RETRY_DELAY}
      processing-timeout: ${OUTBOX_WORKER_PROCESSING_TIMEOUT}
      scheduler-pool-size: ${OUTBOX_WORKER_SCHEDULER_POOL_SIZE}

  market:
    overview-cache-ttl: ${MARKET_OVERVIEW_CACHE_TTL:15s}
    coin-detail-cache-ttl: ${MARKET_COIN_DETAIL_CACHE_TTL:1m}

    sync:
      initial-delay-ms: ${MARKET_SYNC_INITIAL_DELAY_MS}
      markets-delay-ms: ${MARKET_SYNC_MARKETS_DELAY_MS}
      trending-delay-ms: ${MARKET_SYNC_TRENDING_DELAY_MS}
      scheduler-pool-size: ${MARKET_SYNC_SCHEDULER_POOL_SIZE}

    stream:
      base-url: ${MARKET_STREAM_BASE_URL}
      rest-base-url: ${MARKET_STREAM_REST_BASE_URL}
      initial-delay-ms: ${MARKET_STREAM_INITIAL_DELAY_MS}
      reconnect-delay-ms: ${MARKET_STREAM_RECONNECT_DELAY_MS}
      max-pairs: ${MARKET_STREAM_MAX_PAIRS}
      candle-intervals: ${MARKET_STREAM_CANDLE_INTERVALS}
      candle-history-limit: ${MARKET_STREAM_CANDLE_HISTORY_LIMIT}
      ticker-cache-ttl: ${MARKET_STREAM_TICKER_CACHE_TTL}
      ticker-symbols-cache-ttl: ${MARKET_STREAM_TICKER_SYMBOLS_CACHE_TTL}
      candle-cache-ttl: ${MARKET_STREAM_CANDLE_CACHE_TTL}

  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      bucket: ${R2_BUCKET}
      public-base-url: ${R2_PUBLIC_BASE_URL}
      presigned-upload-ttl: ${R2_PRESIGNED_UPLOAD_TTL}
      max-file-size-bytes: ${R2_MAX_FILE_SIZE_BYTES}
      allowed-content-types: ${R2_ALLOWED_CONTENT_TYPES}

  conversation:
    participants-cache-ttl: ${CONVERSATION_PARTICIPANTS_CACHE_TTL:1m}
    pinned-messages-cache-ttl: ${CONVERSATION_PINNED_MESSAGES_CACHE_TTL:1m}

  community:
    categories-cache-ttl: ${COMMUNITY_CATEGORIES_CACHE_TTL:1h}
    tags-cache-ttl: ${COMMUNITY_TAGS_CACHE_TTL:1h}
    discovery-cache-ttl: ${COMMUNITY_DISCOVERY_CACHE_TTL:15s}
    detail-cache-ttl: ${COMMUNITY_DETAIL_CACHE_TTL:10s}

  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    timeout: ${AI_TIMEOUT:30s}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:800}
    temperature: ${AI_TEMPERATURE:0.2}
    native-structured-output: ${AI_NATIVE_STRUCTURED_OUTPUT:false}
    attachment:
      max-files: ${AI_ATTACHMENT_MAX_FILES:5}
      max-image-bytes: ${AI_ATTACHMENT_MAX_IMAGE_BYTES:5242880}
      max-document-bytes: ${AI_ATTACHMENT_MAX_DOCUMENT_BYTES:10485760}
      max-extracted-chars: ${AI_ATTACHMENT_MAX_EXTRACTED_CHARS:12000}
    memory:
      enabled: ${AI_MEMORY_ENABLED:true}
      max-messages: ${AI_MEMORY_MAX_MESSAGES:12}
      ttl: ${AI_MEMORY_TTL:1d}
    rate-limit:
      max-requests: ${AI_RATE_LIMIT_MAX_REQUESTS:20}
      global-max-requests: ${AI_RATE_LIMIT_GLOBAL_MAX_REQUESTS:30}
      window: ${AI_RATE_LIMIT_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
