spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16-alpine:///chat_test
    username: chat_user
    password: chat_password
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

jwt:
  access-token-secret: test-only-access-token-secret-at-least-32-characters
  refresh-token-secret: test-only-refresh-token-secret-at-least-32-characters
  refresh-token-hash-secret: test-only-refresh-token-secret-at-least-32-characters
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

app:
  cors:
    allowed-origins: http://localhost:5173
  outbox:
    worker:
      enabled: false